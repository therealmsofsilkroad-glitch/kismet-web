<!DOCTYPE html>
<!-- web/index.html -->
<!-- Kismet web girişi. iPhone'da Safari > Paylaş > "Ana Ekrana Ekle" ile tam ekran açılır.
     Flutter yüklenirken kalpli açılış ekranı gösterilir; ilk karede kaldırılır. -->
<html lang="tr">
<head>
  <!-- flutter build --base-href ile değiştirilir (ör. /kismet-web/). -->
  <base href="/kismet-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Açılış ekranı için; Flutter yüklenince kendi ayarıyla değiştirir. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kismet: yakınındaki insanlarla tanış, hikayeleri keşfet, eşleş ve sohbet et. 18+">
  <meta name="theme-color" content="#C2296B">
  <meta name="color-scheme" content="light dark">

  <!-- iPhone ana ekran -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kismet">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Kismet</title>

  <style>
    :root { --bg: #FFF7FA; --ink: #2A1420; --t2: #8A6A7A; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0E0A14; --ink: #F6EEF8; --t2: #A897B4; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: var(--bg); transition: opacity .35s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .mark {
      width: 96px; height: 96px; border-radius: 26px;
      background: linear-gradient(135deg, #E84F8A 0%, #C2296B 55%, #8E1C50 100%);
      box-shadow: 0 18px 40px -12px rgba(194, 41, 107, .55);
      display: grid; place-items: center; position: relative;
      animation: beat 1.4s ease-in-out infinite;
    }
    #splash .mark svg { width: 54px; height: 54px; }
    #splash .mark svg.spark {
      position: absolute; right: 13px; top: 11px; width: 20px; height: 20px;
      animation: twinkle 1.4s ease-in-out infinite;
    }
    #splash .name { color: var(--ink); font-size: 22px; font-weight: 800; letter-spacing: .2px; }
    #splash .hint { color: var(--t2); font-size: 13px; font-weight: 600; }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.09); }
      28% { transform: scale(.98); }
      42% { transform: scale(1.06); }
      70% { transform: scale(1); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .55; transform: scale(.85) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.1) rotate(15deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .mark, #splash .spark { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Kismet yükleniyor" role="img">
    <div class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#fff" d="M12 21.2c-.3 0-.6-.1-.8-.3C6.4 16.9 2.5 13.5 2.5 9.3 2.5 6.4 4.8 4 7.7 4c1.7 0 3.3.8 4.3 2.2C13 4.8 14.6 4 16.3 4c2.9 0 5.2 2.4 5.2 5.3 0 4.2-3.9 7.6-8.7 11.6-.2.2-.5.3-.8.3z"/>
      </svg>
      <svg class="spark" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#F3C150" d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/>
      </svg>
    </div>
    <div class="name">Kismet</div>
    <div class="hint">Yükleniyor…</div>
  </div>
  <script>
    // İlk Flutter karesi çizilince açılış ekranı kaybolur.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
